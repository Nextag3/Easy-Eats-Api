spring.application.name=eats

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/senai}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.show-sql=true
# O schema é gerenciado pelo Flyway (db/migration), não pelo Hibernate.
# Mudou uma entidade? Crie uma nova migration Vn__descricao.sql — nunca
# edite uma migration que já foi aplicada.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.lob.non_contextual_creation=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Bancos que já existiam antes do Flyway (criados pelo ddl-auto) recebem
# baseline na versão 1: a V1 (schema inicial) é pulada e só V2+ rodam.
# Banco vazio não recebe baseline e roda tudo a partir da V1.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.out-of-order=false
spring.flyway.placeholders.schema=public

# Chave HMAC-SHA256 em Base64, obrigatória via variável de ambiente — sem
# default, para a aplicação falhar ao subir em vez de usar uma chave
# conhecida (commitada no repo) que permitiria forjar tokens JWT válidos.
# Gere uma nova com: openssl rand -base64 64
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Stripe Connect (contas Express) — usadas para o link público de pedido
# (checkout) e para o onboarding dos restaurantes em Configurações. Sem
# defaults: o app deve falhar ao subir em produção se essas chaves faltarem,
# mesmo padrão já adotado para jwt.secret.
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
stripe.connect.client-id=${STRIPE_CONNECT_CLIENT_ID:}

# Base URL pública do frontend, usada para montar links de retorno (ex.:
# callback de onboarding do Stripe Connect) e o link público do cardápio.
app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:4200}

# Origem adicional liberada no CORS além de localhost:* (produção).
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:}
